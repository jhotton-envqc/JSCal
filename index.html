<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSCal</title>

<style>
:root {
    --payday: #fff59d;
    --holiday: #ffcdd2;
    --holiday-text: #c62828;
}

body {
    font-family: Segoe UI, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    padding: 8px 12px;
    cursor: pointer;
}

#yearLabel {
    font-size: 24px;
    font-weight: bold;
    margin-left: 15px;
}

.legend {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.legend span {
    padding: 5px 10px;
    border-radius: 4px;
    display: inline-block;
}


.today-legend {
    border: 3px solid #2196f3;
    background: white;
    color: black;
}

.holiday-legend {
    border: 2px solid #808080;
    background: white;
    color: #c62828;
}

.payday-legend {
    background: var(--payday);
    color: black;
}

.payday {
    background: var(--payday);
}

.holiday {
    background: var(--holiday);
    color: var(--holiday-text);
}


.calendar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.month {
    background: white;
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
}

.month-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7,1fr);
}

.weekdays div {
    text-align: center;
    font-weight: bold;
    padding: 4px;
}

.day {
    border: 1px solid #eee;
    min-height: 35px;
    text-align: center;
    padding: 4px;
    font-size: 12px;
}

.payday-cell {
    background: var(--payday);
}

.holiday-cell {
    color: var(--holiday-text);
    font-weight: bold;
}

.today-cell {
    border: 3px solid #2196f3 !important;
    box-sizing: border-box;
}


.day {
    position: relative;
    cursor: pointer;
}

.holiday-label {
    font-size: 9px;
    line-height: 1.1;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

@media print {
    button {
        display:none;
    }
}
</style>
</head>

<body>

<header>
    <button onclick="changeYear(-1)">◀</button>
    <button onclick="goToday()">Aujourd'hui</button>
    <button onclick="changeYear(1)">▶</button>

    <span id="yearLabel"></span>

    <button onclick="exportHolidayICS()">
        Exporter les congés (.ics)
    </button>

    <button onclick="exportPayrollICS()">
        Exporter les payes (.ics)
    </button>
</header>

<div class="legend">
    <span class="payday-legend">
        Jour de paye
    </span>

    <span class="holiday-legend">
        Congé férié
    </span>

    <span class="today-legend">
        Aujourd'hui
    </span>
</div>

<div id="calendar" class="calendar"></div>

<script>

let currentYear = new Date().getFullYear();

const MONTHS = [
"Janvier","Février","Mars","Avril",
"Mai","Juin","Juillet","Août",
"Septembre","Octobre","Novembre","Décembre"
];

const WEEKDAYS = [
"L","M","M","J","V","S","D"
];

const PAY_REFERENCE = new Date(2026,0,8);

function formatDate(date)
{
    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2,"0");

    const d = String(
        date.getDate()
    ).padStart(2,"0");

    return `${y}-${m}-${d}`;
}

function addDays(date, days)
{
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
}

function easter(year)
{
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19*a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2*e + 2*i - h - k) % 7;
    const m = Math.floor((a + 11*h + 22*l) / 451);
    const month = Math.floor((h + l - 7*m + 114) / 31);
    const day = ((h + l - 7*m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
}

function getPatriotsDay(year)
{
    let d = new Date(year,4,24);

    while(d.getDay() !== 1)
        d.setDate(d.getDate()-1);

    return d;
}

function firstMonday(year, month)
{
    let d = new Date(year, month, 1);

    while(d.getDay() !== 1)
        d.setDate(d.getDate()+1);

    return d;
}

function secondMonday(year, month)
{
    let d = firstMonday(year, month);
    d.setDate(d.getDate()+7);
    return d;
}

function nearestWorkday(date)
{
    const d = new Date(date);

    if (d.getDay() === 6)      // samedi
    {
        d.setDate(d.getDate() - 1);
    }
    else if (d.getDay() === 0) // dimanche
    {
        d.setDate(d.getDate() + 1);
    }

    return d;
}

function getHolidays(year)
{
    const easterSunday =
        easter(year);

    const holidays =
    [
        {
            name:"Vendredi saint",
            date:addDays(
                easterSunday,
                -2
            )
        },
        {
            name:"Lundi de Pâques",
            date:addDays(
                easterSunday,
                1
            )
        },
        {
            name:"Journée nationale des Patriotes",
            date:getPatriotsDay(year)
        },
        {
            name:"Fête nationale",
            date: nearestWorkday(
                new Date(year,5,24)
            )
        },
        {
            name:"Fête du Canada",
            date: nearestWorkday(
                new Date(year,6,1)
            )
        },
        {
            name:"Fête du Travail",
            date:firstMonday(year,8)
        },
        {
            name:"Action de grâces",
            date:secondMonday(year,9)
        }
    ];

    holidays.push(
        ...getHolidaySeasonHolidays(year)
    );

    return holidays;
}

function daysBetween(date1, date2)
{
    const utc1 = Date.UTC(
        date1.getFullYear(),
        date1.getMonth(),
        date1.getDate()
    );

    const utc2 = Date.UTC(
        date2.getFullYear(),
        date2.getMonth(),
        date2.getDate()
    );

    return Math.floor(
        (utc1 - utc2) / 86400000
    );
}

function isPayDay(date)
{
    const diff =
        daysBetween(
            date,
            PAY_REFERENCE
        );

    return diff % 14 === 0;
}

function isHoliday(date)
{
    const holidays = getHolidays(date.getFullYear());

    return holidays.some(h =>
        formatDate(h.date) === formatDate(date)
    );
}

function addObservedHoliday(
    holidays,
    holidayDate
)
{
    const observed =
        new Date(holidayDate);

    // samedi
    if(observed.getDay() === 6)
    {
        observed.setDate(
            observed.getDate() + 2
        );
    }

    // dimanche
    else if(observed.getDay() === 0)
    {
        observed.setDate(
            observed.getDate() + 1
        );
    }

    while(
        observed.getDay() === 0 ||
        observed.getDay() === 6 ||
        holidays.has(
            formatDate(observed)
        )
    )
    {
        observed.setDate(
            observed.getDate() + 1
        );
    }

    holidays.add(
        formatDate(observed)
    );
}
function getHolidaySeasonHolidays(year)
{
    const holidaySet = new Set();

    function addHoliday(d)
    {
        holidaySet.add(formatDate(d));
    }

    //
    // 24 décembre et 31 décembre
    // samedi/dimanche -> vendredi précédent
    //
    function rule24or31(d)
    {
        const h = new Date(d);

        if (h.getDay() === 6)      // samedi
        {
            h.setDate(h.getDate() - 1);
        }
        else if (h.getDay() === 0) // dimanche
        {
            h.setDate(h.getDate() - 2);
        }

        return h;
    }

    //
    // 25 décembre et 1 janvier
    // samedi/dimanche -> lundi suivant
    //
    function rule25or1(d)
    {
        const h = new Date(d);

        if (h.getDay() === 6)      // samedi
        {
            h.setDate(h.getDate() + 2);
        }
        else if (h.getDay() === 0) // dimanche
        {
            h.setDate(h.getDate() + 1);
        }

        return h;
    }

    //
    // 26 décembre et 2 janvier
    //
    // samedi   -> lundi suivant
    // dimanche -> mardi suivant
    // lundi    -> mardi suivant
    //
    function rule26or2(d)
    {
        const h = new Date(d);

        switch (h.getDay())
        {
            case 6: // samedi
                h.setDate(h.getDate() + 2);
                break;

            case 0: // dimanche
                h.setDate(h.getDate() + 2);
                break;

            case 1: // lundi
                h.setDate(h.getDate() + 1);
                break;
        }

        return h;
    }

    const candidates =
    [
        //
        // bloc provenant de l'année précédente
        //

        rule24or31(
            new Date(year - 1, 11, 31)
        ),

        rule25or1(
            new Date(year, 0, 1)
        ),

        rule26or2(
            new Date(year, 0, 2)
        ),

        //
        // bloc de Noël
        //

        rule24or31(
            new Date(year, 11, 24)
        ),

        rule25or1(
            new Date(year, 11, 25)
        ),

        rule26or2(
            new Date(year, 11, 26)
        ),

        //
        // bloc du Jour de l'An suivant
        //

        rule24or31(
            new Date(year, 11, 31)
        ),

        rule25or1(
            new Date(year + 1, 0, 1)
        ),

        rule26or2(
            new Date(year + 1, 0, 2)
        )
    ];

    candidates.forEach(addHoliday);

    return [...holidaySet]
        .map(str => ({
            name: "Congé des Fêtes",
            date: new Date(str + "T12:00:00")
        }))
        .filter(h =>
            h.date.getFullYear() === year
        )
        .sort((a, b) => a.date - b.date);
}

function getHolidayName(date)
{
    const holiday =
        getHolidays(date.getFullYear())
        .find(h =>
            formatDate(h.date) === formatDate(date)
        );

    return holiday ? holiday.name : null;
}

function getPayPeriodNumber(date)
{
    const diff =
        daysBetween(
            date,
            PAY_REFERENCE
        );

    if(diff % 14 !== 0)
        return null;

    return Math.floor(diff / 14) + 1;
}

function isWeekend(date)
{
    return date.getDay() === 0 ||
           date.getDay() === 6;
}

function key(date)
{
    return formatDate(date);
}











function addObservedHoliday(
    holidays,
    holidayDate
)
{
    const observed =
        new Date(holidayDate);

    if(observed.getDay() === 6)
    {
        // samedi JS
        observed.setDate(
            observed.getDate() + 2
        );
    }
    else if(observed.getDay() === 0)
    {
        // dimanche JS
        observed.setDate(
            observed.getDate() + 1
        );
    }

    while(
        isWeekend(observed) ||
        holidays.has(
            formatDate(observed)
        )
    )
    {
        observed.setDate(
            observed.getDate() + 1
        );
    }

    holidays.add(
        formatDate(observed)
    );
}


function moveToPreviousWorkday(date)
{
    const d = new Date(date);

    while(isWeekend(d))
    {
        d.setDate(d.getDate() - 1);
    }

    return d;
}


function renderCalendar()
{
    document.getElementById("yearLabel")
        .textContent = currentYear;

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    for(let month=0; month<12; month++)
    {
        const monthDiv =
            document.createElement("div");

        monthDiv.className = "month";

        const title =
            document.createElement("div");

        title.className = "month-title";
        title.textContent = MONTHS[month];

        monthDiv.appendChild(title);

        const weekdays =
            document.createElement("div");

        weekdays.className = "weekdays";

        WEEKDAYS.forEach(w => {
            const e=document.createElement("div");
            e.textContent=w;
            weekdays.appendChild(e);
        });

        monthDiv.appendChild(weekdays);

        const days =
            document.createElement("div");

        days.className="days";

        const firstDay =
            new Date(currentYear,month,1);

        const start =
            (firstDay.getDay()+6)%7;

        for(let i=0;i<start;i++)
        {
            days.appendChild(
                document.createElement("div")
            );
        }

        const lastDay =
            new Date(
                currentYear,
                month+1,
                0
            ).getDate();

        for(let day=1; day<=lastDay; day++)
        {
            const cell =
                document.createElement("div");

            cell.className = "day";

            const date =
                new Date(
                    currentYear,
                    month,
                    day
                );

            const today = new Date();

            const isToday =
                date.getFullYear() === today.getFullYear() &&
                date.getMonth() === today.getMonth() &&
                date.getDate() === today.getDate();

            if(isToday)
            {
                cell.classList.add("today-cell");
            }

            let tooltip = [];


            if(isPayDay(date))
            {
                cell.classList.add(
                    "payday-cell"
                );

                const period =
                    getPayPeriodNumber(date);

                tooltip.push(
                    `Jour de paye (période ${period})`
                );
            }

            const holidayName =
                getHolidayName(date);

            if(holidayName)
            {
                cell.classList.add(
                    "holiday-cell"
                );

                tooltip.push(
                    holidayName
                );
            }

            if(tooltip.length > 0)
            {
                cell.title =
                    tooltip.join("\n");
            }

            cell.textContent = day;


            days.appendChild(cell);
        }

        monthDiv.appendChild(days);

        calendar.appendChild(monthDiv);
    }
}

function changeYear(delta)
{
    currentYear += delta;
    renderCalendar();
}

function goToday()
{
    currentYear =
        new Date().getFullYear();

    renderCalendar();
}

function downloadFile(filename, text)
{
    const blob =
        new Blob(
            [text],
            {type:"text/calendar"}
        );

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download = filename;

    link.click();
}

function exportHolidayICS()
{
    const holidays =
        getHolidays(currentYear);

    let ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//JSCal//FR
`;

    holidays.forEach(h => {

        const start =
            formatDate(h.date)
            .replace(/-/g,'');

        const end =
            formatDate(
                addDays(h.date,1)
            ).replace(/-/g,'');

        ics +=
`BEGIN:VEVENT
SUMMARY:${h.name}
DTSTART;VALUE=DATE:${start}
DTEND;VALUE=DATE:${end}
X-MICROSOFT-CDO-BUSYSTATUS:OOF
END:VEVENT
`;
    });

    ics += "END:VCALENDAR";

    downloadFile(
        `Conges_${currentYear}.ics`,
        ics
    );
}

function exportPayrollICS()
{
    let ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//JSCal//FR
`;

    let d =
        new Date(
            currentYear,
            0,
            1
        );

    while(d.getFullYear() === currentYear)
    {
        if(isPayDay(d))
        {
            const start =
                formatDate(d)
                .replace(/-/g,'');

            const end =
                formatDate(
                    addDays(d,1)
                ).replace(/-/g,'');

            ics +=
`BEGIN:VEVENT
SUMMARY:Jour de paye
DTSTART;VALUE=DATE:${start}
DTEND;VALUE=DATE:${end}
X-MICROSOFT-CDO-BUSYSTATUS:FREE
END:VEVENT
`;
        }

        d.setDate(d.getDate()+1);
    }

    ics += "END:VCALENDAR";

    downloadFile(
        `Payes_${currentYear}.ics`,
        ics
    );
}

console.log(
    getHolidaySeasonHolidays(2026)
        .map(h => ({
            nom: h.name,
            date: formatDate(h.date)
        }))
);

renderCalendar();

</script>

</body>
</html>
